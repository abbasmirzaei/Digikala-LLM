[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digikala-llm"
version = "0.1.0"
description = "Product search and review analytics baseline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3",
  "pyarrow==21.0.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6,<8",
  "matplotlib>=3.8,<4",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "seaborn>=0.13,<1",
]
demo = ["streamlit>=1.39,<2", "groq>=0.20"]
semantic = ["sentence-transformers>=6,<7", "torch>=2.13,<3"]

[project.scripts]
digikala-eda = "digikala_llm.eda:main"
digikala-clean-products = "digikala_llm.products_pipeline:main"
digikala-clean-comments = "digikala_llm.comments_pipeline:main"
digikala-category-viability = "digikala_llm.category_viability:main"
digikala-build-sunscreen = "digikala_llm.sunscreen_builder:main"
digikala-search-sunscreen = "digikala_llm.sunscreen_retrieval:main"
digikala-compare-sunscreen = "digikala_llm.sunscreen_comparison:main"
digikala-evaluate-sunscreen = "digikala_llm.sunscreen_evaluation:main"
digikala-build-sunscreen-semantic = "digikala_llm.sunscreen_semantic_builder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
