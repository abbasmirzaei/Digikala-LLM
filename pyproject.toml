[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digikala-llm"
version = "0.1.0"
description = "Product search and review analytics baseline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
digikala-eda = "digikala_llm.eda:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

